# SRS 5 配置：RTMP 接入(1935) + HLS/HTTP-FLV 分发(8080)
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    # HLS 输出（观众端 hls.js 播放）
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    2;
        hls_window      20;
        hls_cleanup     on;
        hls_dispose     10;
    }
    # HTTP-FLV 输出（可选低延迟拉流）
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
